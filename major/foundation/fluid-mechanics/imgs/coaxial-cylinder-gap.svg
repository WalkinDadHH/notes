<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">同心圆柱窄环隙中的旋转流动</title>
  <desc id="desc">左图为转轴和静止外筒的同心横截面，右图表示轴面速度为 omega d 除以二，外壁静止，窄环隙内速度近似线性。</desc>
  <defs>
    <style>
      .label{font:20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263344}
      .small{font:17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263344}
      .formula{font:italic 22px Georgia,serif;fill:#263344}
      .shaft{fill:#f2b576;stroke:#a75824;stroke-width:3}
      .fluid{fill:#eaf4f8;stroke:#2585a7;stroke-width:2}
      .fixed{fill:#ced9e6;stroke:#60758b;stroke-width:2}
      .arrow{stroke:#bd5627;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bd5627"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="388" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-width="2"/>
  <text x="40" y="44" class="label">横截面：轴面旋转，外筒固定</text>
  <circle cx="235" cy="205" r="131" class="fixed"/>
  <circle cx="235" cy="205" r="105" class="fluid"/>
  <circle cx="235" cy="205" r="88" class="shaft"/>
  <path d="M179 140 A82 82 0 0 1 290 144" class="arrow"/>
  <text x="300" y="139" class="formula">ω</text>
  <path d="M235 205 H323" stroke="#263344" stroke-width="2"/>
  <text x="267" y="194" class="formula">d/2</text>
  <path d="M324 181 V202" stroke="#bd5627" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/>
  <text x="335" y="198" class="formula">δ</text>
  <text x="111" y="214" class="small">旋转轴</text>
  <text x="112" y="363" class="small">环隙中充满黏性流体</text>
  <line x1="474" y1="62" x2="474" y2="342" stroke="#d7e1eb" stroke-width="2"/>
  <text x="512" y="44" class="label">窄隙速度剖面（沿径向放大）</text>
  <rect x="594" y="104" width="241" height="209" fill="#eaf4f8" opacity=".65"/>
  <rect x="566" y="104" width="28" height="209" rx="3" class="shaft"/>
  <rect x="835" y="104" width="28" height="209" rx="3" class="fixed"/>
  <path d="M596 111 L833 305" stroke="#2585a7" stroke-width="5"/>
  <path d="M605 111 H697" class="arrow"/>
  <text x="612" y="91" class="formula">v₀ = ωd/2</text>
  <text x="802" y="337" class="small">0</text>
  <text x="559" y="337" class="small">轴面</text>
  <text x="810" y="365" class="small">静止外筒</text>
  <text x="694" y="238" class="formula">δ</text>
  <text x="548" y="379" class="formula">τ = μv₀/δ　　润湿面积 A = πdL</text>
</svg>
