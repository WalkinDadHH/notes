<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">圆盘窄缝转动与微元环带</title>
  <desc id="desc">左侧为旋转圆盘与静止壁面之间的窄缝剖面，右侧为半径 r、宽 dr 的圆环微元。盘面局部速度为 ωr，圆环面积为 2πr dr。</desc>
  <defs>
    <style>
      .label{font:20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263344}
      .small{font:18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263344}
      .formula{font:italic 22px Georgia,serif;fill:#263344}
      .wall{fill:#ced9e6;stroke:#60758b;stroke-width:2}
      .disk{fill:#f2b576;stroke:#a75824;stroke-width:2}
      .guide{stroke:#788a9c;stroke-width:2;stroke-dasharray:6 6}
      .arrow{stroke:#bd5627;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#bd5627"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="408" rx="18" fill="#f8fafc" stroke="#d9e2eb" stroke-width="2"/>
  <text x="42" y="48" class="label">剖面：一侧盘面与静止壁面之间的窄缝</text>
  <rect x="68" y="123" width="415" height="26" rx="4" class="disk"/>
  <text x="76" y="110" class="small">旋转圆盘</text>
  <path d="M246 100 C253 72 297 70 309 95" class="arrow"/>
  <text x="325" y="90" class="formula">ω</text>
  <rect x="68" y="287" width="415" height="26" rx="4" class="wall"/>
  <text x="75" y="344" class="small">静止壁面，速度为 0</text>
  <path d="M148 150 V285" class="guide"/>
  <path d="M367 150 V285" class="guide"/>
  <path d="M411 158 V278" stroke="#60758b" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/>
  <text x="426" y="226" class="formula">δ</text>
  <path d="M170 270 L326 165" stroke="#2585a7" stroke-width="4"/>
  <text x="188" y="247" class="small">速度近似线性变化</text>
  <path d="M342 170 H393" class="arrow"/>
  <text x="284" y="198" class="formula">v₀ = ωr</text>
  <line x1="516" y1="63" x2="516" y2="355" stroke="#d7e1eb" stroke-width="2"/>
  <text x="551" y="48" class="label">俯视：取一个微元圆环</text>
  <circle cx="721" cy="205" r="133" fill="#f9e9d8" stroke="#a75824" stroke-width="2"/>
  <circle cx="721" cy="205" r="94" fill="none" stroke="#e47d36" stroke-width="18"/>
  <circle cx="721" cy="205" r="4" fill="#263344"/>
  <path d="M721 205 H815" stroke="#263344" stroke-width="2" marker-end="url(#head)"/>
  <text x="754" y="192" class="formula">r</text>
  <path d="M808 109 L825 100" stroke="#263344" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/>
  <text x="832" y="100" class="formula">dr</text>
  <path d="M621 312 C688 365 791 342 825 292" class="arrow"/>
  <text x="552" y="379" class="formula">dA = 2πr dr　　dM = r · τ dA</text>
</svg>
