{% if page.meta.comments %}
<h2 id="__comments">{{ lang.t("meta.comments") }}</h2>

<div class="giscus"></div>

<script>
  (function () {
    var currentTheme = function () {
      var scheme = document.body.getAttribute("data-md-color-scheme");
      return scheme === "slate" ? "transparent_dark" : "light";
    };

    var client = document.createElement("script");
    var config = {
      "data-repo": "WalkinDadHH/notes",
      "data-repo-id": "R_kgDOSBMhbw",
      "data-category": "General",
      "data-category-id": "DIC_kwDOSBMhb84C6vgb",
      "data-mapping": "pathname",
      "data-strict": "0",
      "data-reactions-enabled": "1",
      "data-emit-metadata": "0",
      "data-input-position": "bottom",
      "data-theme": currentTheme(),
      "data-lang": "zh-CN"
    };
    Object.keys(config).forEach(function (name) {
      client.setAttribute(name, config[name]);
    });
    client.src = "https://giscus.app/client.js";
    client.crossOrigin = "anonymous";
    client.async = true;
    document.currentScript.parentNode.appendChild(client);

    new MutationObserver(function () {
      var frame = document.querySelector("iframe.giscus-frame");
      if (frame) {
        frame.contentWindow.postMessage(
          { giscus: { setConfig: { theme: currentTheme() } } },
          "https://giscus.app"
        );
      }
    }).observe(document.body, {
      attributes: true,
      attributeFilter: ["data-md-color-scheme"]
    });
  })();
</script>
{% endif %}
